[package]
name = "vocorum-app"
version = "0.2.4"
description = "Vocorum desktop and iPhone app"
authors = ["Xipz"]
license-file = "../../../LICENSE"
edition = "2021"
rust-version = "1.85"

[lib]
name = "vocorum_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-deep-link = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ed25519-dalek = { version = "3", features = ["zeroize"] }
getrandom = "0.4"
sha2 = "0.11"
base64 = "0.23"
url = "2"
keyring-core = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-updater = "=2.14.1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = { version = "2", features = ["OSX_10_15"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext"] }
core-foundation = "0.10"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }
security-framework = "3"
security-framework-sys = "2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext"] }
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "Security_Credentials", "Security_Cryptography", "Security_Cryptography_Core", "Storage_Streams", "UI_Notifications"] }
